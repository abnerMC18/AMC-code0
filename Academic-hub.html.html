<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d16" />
    <title>AcademicHub - IF Goiano</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script
      src="https://unpkg.com/react@18/umd/react.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>
      .fc {
        --fc-border-color: #334155;
        --fc-page-bg-color: #0f172a;
        --fc-neutral-bg-color: #1e293b;
        --fc-list-event-hover-bg-color: #334155;
        color: #f8fafc;
      }
      .fc .fc-toolbar-title {
        font-size: 1.1rem;
        font-weight: 600;
      }
      .fc .fc-button-primary {
        background-color: #059669;
        border-color: #059669;
      }
      .fc .fc-button-primary:hover {
        background-color: #047857;
        border-color: #047857;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // --- CONFIGURAÇÃO DO SUPABASE ---
      const SUPABASE_URL = "SUA_URL_AQUI";
      const SUPABASE_KEY = "SUA_CHAVE_AQUI";
      const SENHA_REPRESENTANTE = "info2026";

      const supabaseClient =
        SUPABASE_KEY && !SUPABASE_KEY.includes("SUA_CHAVE")
          ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
          : null;

      function App() {
        const [eventos, setEventos] = useState([]);
        const [materiais, setMateriais] = useState([]);
        const [aba, setAba] = useState("dashboard");
        const [isEditor, setIsEditor] = useState(false);

        // Formulário de Atividades
        const [titulo, setTitulo] = useState("");
        const [descricao, setDescricao] = useState("");
        const [tipo, setTipo] = useState("prova");
        const [dataHora, setDataHora] = useState("");

        // Formulário de Materiais PDF
        const [nomeMaterial, setNomeMaterial] = useState("");
        const [arquivoPDF, setArquivoPDF] = useState(null);
        const [disciplina, setDisciplina] = useState("");
        const [enviando, setEnviando] = useState(false);

        const calendarRef = useRef(null);

        // Carregar eventos do Banco de Dados
        const carregarEventos = async () => {
          if (!supabaseClient) return;
          try {
            const { data, error } = await supabaseClient
              .from("provas")
              .select("*");
            if (data) {
              const formatados = data.map((item) => ({
                id: String(item.id),
                title: `[${item.tipo ? item.tipo.toUpperCase() : "EVENTO"}] ${item.title}`,
                start: item.start,
                color:
                  item.tipo === "prova"
                    ? "#dc2626"
                    : item.tipo === "dever"
                      ? "#d97706"
                      : item.tipo === "evento"
                        ? "#8b5cf6"
                        : "#2563eb",
                tipo: item.tipo,
                nomeOriginal: item.title,
                descricao: item.descricao || "Sem descrição cadastrada.",
              }));
              setEventos(formatados);
            }
          } catch (err) {
            console.error("Erro ao carregar dados:", err);
          }
        };

        // Carregar materiais em PDF
        const carregarMateriais = async () => {
          if (!supabaseClient) return;
          try {
            const { data, error } = await supabaseClient
              .from("materiais")
              .select("*");
            if (data) {
              setMateriais(data);
            }
          } catch (err) {
            console.error("Erro ao carregar materiais:", err);
          }
        };

        useEffect(() => {
          carregarEventos();
          carregarMateriais();
        }, []);

        // Renderizar Calendário
        useEffect(() => {
          if (aba === "calendario" && calendarRef.current) {
            const calendar = new FullCalendar.Calendar(calendarRef.current, {
              initialView: "dayGridMonth",
              locale: "pt-br",
              headerToolbar: {
                left: "prev,next today",
                center: "title",
                right: "dayGridMonth,timeGridWeek",
              },
              events: eventos,
              height: "75vh",
            });
            calendar.render();
          }
        }, [aba, eventos]);

        const autenticarRepresentante = () => {
          if (isEditor) {
            setIsEditor(false);
            alert("Modo Editor desativado.");
            return;
          }
          const senhaDigitada = prompt("Digite a senha de Representante:");
          if (senhaDigitada === SENHA_REPRESENTANTE) {
            setIsEditor(true);
            alert("Acesso concedido!");
          } else if (senhaDigitada !== null) {
            alert("Senha incorreta!");
          }
        };

        const criarEvento = async (e) => {
          e.preventDefault();
          if (!titulo || !dataHora) return;
          if (!supabaseClient) {
            alert("Supabase não configurado!");
            return;
          }

          const { error } = await supabaseClient.from("provas").insert([
            {
              title: titulo,
              tipo: tipo,
              start: dataHora,
              descricao: descricao,
            },
          ]);

          if (!error) {
            alert("Evento publicado com sucesso!");
            setTitulo("");
            setDescricao("");
            setDataHora("");
            carregarEventos();
          }
        };

        const deletarEvento = async (id) => {
          if (!confirm("Tem certeza que deseja apagar?")) return;
          if (!supabaseClient) return;
          const { error } = await supabaseClient
            .from("provas")
            .delete()
            .eq("id", id);
          if (!error) carregarEventos();
        };

        const publicarMaterial = async (e) => {
          e.preventDefault();
          if (!nomeMaterial || !arquivoPDF) return;
          if (!supabaseClient) return;

          try {
            setEnviando(true);
            const extensao = arquivoPDF.name.split(".").pop();
            const nomeArquivoUnico = `${Date.now()}_${Math.random().toString(36).substring(7)}.${extensao}`;

            const { data: storageData, error: storageError } =
              await supabaseClient.storage
                .from("MATERIAIS_PDF")
                .upload(nomeArquivoUnico, arquivoPDF);

            if (storageError) throw storageError;

            const { data: publicUrlData } = supabaseClient.storage
              .from("MATERIAIS_PDF")
              .getPublicUrl(nomeArquivoUnico);

            const { error: dbError } = await supabaseClient
              .from("materiais")
              .insert([
                {
                  nome: nomeMaterial,
                  url: publicUrlData.publicUrl,
                  disciplina: disciplina || "Geral",
                },
              ]);

            if (dbError) throw dbError;

            alert("PDF enviado com sucesso!");
            setNomeMaterial("");
            setDisciplina("");
            setArquivoPDF(null);
            carregarMateriais();
          } catch (error) {
            alert("Erro: " + error.message);
          } finally {
            setEnviando(false);
          }
        };

        const deletarMaterial = async (id) => {
          if (!confirm("Tem certeza que deseja excluir?")) return;
          if (!supabaseClient) return;
          const { error } = await supabaseClient
            .from("materiais")
            .delete()
            .eq("id", id);
          if (!error) carregarMateriais();
        };

        return (
          <div className="flex flex-col md:flex-row h-screen bg-slate-950 text-slate-100 font-sans">
            {/* Sidebar */}
            <aside className="w-full md:w-64 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 p-6 flex flex-col justify-between">
              <div>
                <div className="flex items-center gap-3 mb-8">
                  <div className="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center font-bold text-xl text-white shadow-lg shadow-emerald-900/40">
                    IF
                  </div>
                  <div>
                    <h1 className="font-bold text-lg tracking-wide text-white">
                      AcademicHub
                    </h1>
                    <span className="text-xs text-slate-400">
                      2º Téc. Informática
                    </span>
                  </div>
                </div>

                <nav className="space-y-2">
                  <button
                    onClick={() => setAba("dashboard")}
                    className={`w-full text-left px-4 py-3 rounded-xl font-medium flex items-center gap-3 transition ${aba === "dashboard" ? "bg-emerald-600/10 text-emerald-400 border border-emerald-500/20" : "text-slate-400 hover:bg-slate-800"}`}
                  >
                    📖 Painel Principal
                  </button>
                  <button
                    onClick={() => setAba("grade")}
                    className={`w-full text-left px-4 py-3 rounded-xl font-medium flex items-center gap-3 transition ${aba === "grade" ? "bg-emerald-600/10 text-emerald-400 border border-emerald-500/20" : "text-slate-400 hover:bg-slate-800"}`}
                  >
                    📊 Grade Horária
                  </button>
                  <button
                    onClick={() => setAba("materiais")}
                    className={`w-full text-left px-4 py-3 rounded-xl font-medium flex items-center gap-3 transition ${aba === "materiais" ? "bg-emerald-600/10 text-emerald-400 border border-emerald-500/20" : "text-slate-400 hover:bg-slate-800"}`}
                  >
                    📄 Materiais & PDFs
                  </button>
                  <button
                    onClick={() => setAba("calendario")}
                    className={`w-full text-left px-4 py-3 rounded-xl font-medium flex items-center gap-3 transition ${aba === "calendario" ? "bg-emerald-600/10 text-emerald-400 border border-emerald-500/20" : "text-slate-400 hover:bg-slate-800"}`}
                  >
                    📅 Calendário
                  </button>
                </nav>
              </div>

              <div className="mt-6 md:mt-0 space-y-3">
                <button
                  onClick={autenticarRepresentante}
                  className={`w-full text-xs font-semibold py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 transition ${isEditor ? "bg-amber-500/20 text-amber-400 border border-amber-500/30" : "bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700"}`}
                >
                  {isEditor ? "🔓 Modo Editor" : "🔒 Acesso Representante"}
                </button>
              </div>
            </aside>

            {/* Conteúdo */}
            <main className="flex-1 p-4 md:p-8 overflow-y-auto">
              {/* Dashboard */}
              {aba === "dashboard" && (
                <div className="max-w-5xl mx-auto space-y-8">
                  <header>
                    <h2 className="text-2xl font-bold text-white">
                      Mural de Atividades
                    </h2>
                  </header>
                  {/* Aqui vai o código dos formulários e lista de eventos do dashboard que você já tem no arquivo */}
                  <p className="text-slate-400">
                    Navegue pelas abas ao lado para acessar as funcionalidades
                    completas.
                  </p>
                </div>
              )}

              {/* Calendário */}
              {aba === "calendario" && (
                <div className="max-w-5xl mx-auto space-y-4">
                  <h2 className="text-2xl font-bold text-white mb-4">
                    Calendário
                  </h2>
                  <div
                    ref={calendarRef}
                    className="bg-slate-900 p-4 rounded-xl border border-slate-800"
                  ></div>
                </div>
              )}

              {/* Materiais */}
              {aba === "materiais" && (
                <div className="max-w-5xl mx-auto space-y-8">
                  <h2 className="text-2xl font-bold text-white mb-4">
                    Materiais & PDFs
                  </h2>
                  {/* Aqui vai a interface de envio e lista de materiais */}
                </div>
              )}

              {/* Grade Horária (Com a tabela completada) */}
              {aba === "grade" && (
                <div className="max-w-6xl mx-auto space-y-6">
                  <header className="flex justify-between items-center">
                    <div>
                      <h2 className="text-2xl font-bold text-white">
                        Grade Horária Semanal
                      </h2>
                      <p className="text-slate-400 text-sm">
                        2º ano Téc. Informática - IF Goiano
                      </p>
                    </div>
                    <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-3 py-1.5 rounded-full font-semibold">
                      INFO 2
                    </span>
                  </header>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse text-xs md:text-sm">
                        <thead>
                          <tr className="bg-slate-800/80 text-slate-300 border-b border-slate-700">
                            <th className="p-4 border-r border-slate-700/50 w-24">
                              Turno
                            </th>
                            <th className="p-4 border-r border-slate-700/50 w-20">
                              Horário
                            </th>
                            <th className="p-4 border-r border-slate-700/50 font-semibold text-emerald-400">
                              Seg
                            </th>
                            <th className="p-4 border-r border-slate-700/50 font-semibold text-emerald-400">
                              Ter
                            </th>
                            <th className="p-4 border-r border-slate-700/50 font-semibold text-emerald-400">
                              Qua
                            </th>
                            <th className="p-4 border-r border-slate-700/50 font-semibold text-emerald-400">
                              Qui
                            </th>
                            <th className="p-4 font-semibold text-emerald-400">
                              Sex
                            </th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800 text-slate-200">
                          <tr className="hover:bg-slate-800/30 transition">
                            <td
                              rowSpan="4"
                              className="p-4 font-bold border-r border-slate-800 bg-slate-900/50 text-slate-400 text-center uppercase"
                            >
                              Matutino
                            </td>
                            <td className="p-3 border-r border-slate-800 font-mono text-slate-400">
                              08:00
                            </td>
                            <td className="p-3 border-r border-slate-800/50">
                              <strong>ELETRÔNICA BÁSICA</strong>
                              <br />
                              <span className="text-slate-400 text-xs">
                                André Wild
                              </span>
                            </td>
                            <td className="p-3 border-r border-slate-800/50">
                              <strong>FILOSOFIA II</strong>
                              <br />
                              <span className="text-slate-400 text-xs">
                                Flávio Oliveira
                              </span>
                            </td>
                            <td className="p-3 border-r border-slate-800/50">
                              <strong>SOCIOLOGIA II</strong>
                              <br />
                              <span className="text-slate-400 text-xs">
                                Maria Otavia
                              </span>
                            </td>
                            <td className="p-3 border-r border-slate-800/50">
                              <strong>PORTUGUÊS II</strong>
                              <br />
                              <span className="text-slate-400 text-xs">
                                Mariana Rodrigues
                              </span>
                            </td>
                            <td className="p-3">
                              <strong>DESENVOLVIMENTO WEB II</strong>
                              <br />
                              <span className="text-slate-400 text-xs">
                                Franciele INFO
                              </span>
                            </td>
                          </tr>

                          <tr className="hover:bg-slate-800/30 transition">
                            <td className="p-3 border-r border-slate-800 font-mono text-slate-400">
                              09:00
                            </td>
                            <td className="p-3 border-r border-slate-800/50">
                              <strong>ELETRÔNICA BÁSICA</strong>
                              <br />
                              <span className="text-slate-400 text-xs">
                                André Wild
                              </span>
                            </td>
                            <td className="p-3 border-r border-slate-800/50">
                              <strong>FILOSOFIA II</strong>
                              <br />
                              <span className="text-slate-400 text-xs">
                                Flávio Oliveira
                              </span>
                            </td>
                            <td className="p-3 border-r border-slate-800/50">
                              <strong>EDUCAÇÃO FÍSICA II</strong>
                              <br />
                              <span className="text-slate-400 text-xs">
                                Thalita Cintra
                              </span>
                            </td>
                            <td className="p-3 border-r border-slate-800/50">
                              <strong>ORIENTAÇÃO OBJETO</strong>
                              <br />
                              <span className="text-slate-400 text-xs">

                              </span>
                            </td>
                            <td className="p-3">

                              <br />
                              <span className="text-slate-400 text-xs">
                                Franciele INFO
                              </span>
                            </td>
                          </tr>

                          <tr className="hover:bg-slate-800/30 transition">
                            <td className="p-3 border-r border-slate-800 font-mono text-slate-400">
                              10:20
                            </td>
                            <td className="p-3 border-r border-slate-800/50">
                              <strong>GEOGRAFIA II</strong>
                              <br />
                              <span className="text-slate-400 text-xs">
                                Laise Cabral
                              </span>
                            </td>
                            <td className="p-3 border-r border-slate-800/50">
                              <strong>QUÍMICA II</strong>
                              <br />
                              <span className="text-slate-400 text-xs">
                                Gustavo
                              </span>
                            </td>
                            <td className="p-3 border-r border-slate-800/50">
                              <strong>PORTUGUÊS II</strong>
                              <br />
                              <span className="text-slate-400 text-xs">
                                Mariana Rodrigues
                              </span>
                            </td>
                            <td className="p-3 border-r border-slate-800/50">
                              <strong>ORIENTAÇÃO OBJETO</strong>
                              <br />

                            <td className="p-3">

                          <tr className="hover:bg-slate-800/30 transition">

                            <td className="p-3 border-r border-slate-800/50">

                              <br />
                              <span className="text-slate-400 text-xs">

                            </td>
                            <td className="p-3 border-r border-slate-800/50">

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
